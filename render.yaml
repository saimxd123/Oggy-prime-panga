services:
  - type: worker
    name: oggy-prime-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: MASS_WORKERS
        value: "60"
      - key: PYTHON_VERSION
        value: "3.11.0"
